name: Tự động đóng gói APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cài đặt Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Tự động tạo tệp cấu hình pubspec.yaml chuẩn
        run: |
          cat << 'EOF' > pubspec.yaml
          name: so_truc_ban_tru
          description: "Sổ trực bán trú THCS Phan Thanh"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            pdf: ^3.10.8
            printing: ^5.12.0
            intl: ^0.20.3
            cupertino_icons: ^1.0.6
            shared_preferences: ^2.2.3

          flutter:
            uses-material-design: true
            assets:
              - assets/fonts/
          EOF

      - name: Tạo cấu trúc nền tảng Android
        run: |
          flutter create temp_app --platforms=android --project-name=so_truc_ban_tru
          cp -r temp_app/android .
          rm -rf temp_app

      - name: Tải bộ font tiếng Việt nhúng Offline
        run: |
          mkdir -p assets/fonts
          curl -L -o assets/fonts/Roboto-Regular.ttf https://github.com/googlefonts/roboto/raw/main/src/hinted/Roboto-Regular.ttf
          curl -L -o assets/fonts/Roboto-Bold.ttf https://github.com/googlefonts/roboto/raw/main/src/hinted/Roboto-Bold.ttf
          curl -L -o assets/fonts/Roboto-Italic.ttf https://github.com/googlefonts/roboto/raw/main/src/hinted/Roboto-Italic.ttf
          curl -L -o assets/fonts/Roboto-BoldItalic.ttf https://github.com/googlefonts/roboto/raw/main/src/hinted/Roboto-BoldItalic.ttf

      - name: Cài đặt thư viện
        run: flutter pub get

      - name: Đóng gói APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Đẩy file APK lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: So-Truc-Ban-Tru-APK
          path: build/app/outputs/flutter-apk/app-release.apk
